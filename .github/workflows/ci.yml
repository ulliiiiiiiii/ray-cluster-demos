name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run both demos briefly
        run: |
          python city_virus.py --people 5000 --steps 3 --width 200 --height 200
          python mandelbrot_ray.py --frames 2 --width 40 --height 16 --pause 0
